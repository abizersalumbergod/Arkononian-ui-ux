name: Publish arkononion-ui-ux to npm

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  SKILL_NAME: arkononion-ui-ux

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify SKILL.md frontmatter name is arkononion-ui-ux
        run: |
          node -e '
            const fs = require("node:fs");
            const skill = fs.readFileSync("SKILL.md", "utf8");
            if (!/^---\r?\n[\s\S]*?^name:\s*arkononion-ui-ux\s*$/m.test(skill)) {
              console.error("ERROR: SKILL.md frontmatter name must be set to arkononion-ui-ux");
              process.exit(1);
            }
          '

      - name: Gate A - Validate skill structure, links, schemas and secrets
        run: node scripts/validate-skill.mjs

      - name: Check generated docs for drift
        run: node scripts/build-docs.mjs --check

      - name: Run unit and integration test suites
        run: node --test "tests/*.test.mjs"

      - name: Check the release tag matches package.json version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e '
            const version = require("./package.json").version;
            const tag = process.env.TAG.replace(/^v/, "");
            if (tag !== version) {
              console.error(`ERROR: release tag ${process.env.TAG} does not match package.json version ${version}`);
              process.exit(1);
            }
          '

      - name: List package contents
        run: npm pack --dry-run

  publish-npm:
    if: ${{ github.event.repository.private == false }}
    needs: validate-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for npmjs.org
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Ensure package.json name and repository metadata match
        env:
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = process.env.SKILL_NAME;
            pkg.repository = {
              type: "git",
              url: `git+https://github.com/${process.env.REPO}.git`
            };
            delete pkg.publishConfig;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      # npm provenance only works for public repositories, so we skip publishing when the repo is private.
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
